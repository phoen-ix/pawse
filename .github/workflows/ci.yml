name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK is chosen by global.json, not here: setup-dotnet installs ALONGSIDE
          # what the runner image ships and `dotnet` then picks the newest one, so a bare
          # dotnet-version pins nothing and a new image could swap the SDK under the build.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Pawse.sln

      - name: Build (Release)
        run: dotnet build Pawse.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Pawse.Tests/Pawse.Tests.csproj -c Release --no-build

      - name: Format check
        run: dotnet format Pawse.sln --verify-no-changes --severity warn
      # No publish here: installer-smoke below runs the exact publishes release.yml runs
      # (minus the version) and installs what they produce, so a publish-only break still
      # fails the push - once, instead of on two runners.

  # Compile-only, and fast: catches a broken pawse.nsi (bad !insertmacro, unreferenced
  # function) within seconds of a push. The stub exes just satisfy the File directives;
  # installer-smoke below is the job that runs a real one.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Stub the release exes
        run: |
          : > packaging/Pawse.exe
          : > packaging/Pawse-min.exe

      # -WX: a warning here (an unreferenced function, a bad !insertmacro) means the
      # script is not doing what it reads like it does.
      - name: Compile all three installers
        run: |
          makensis -WX -V2 -DVERSION=0.0.0 packaging/pawse.nsi
          makensis -WX -V2 -DVERSION=0.0.0 -DFULL_ONLY packaging/pawse.nsi
          makensis -WX -V2 -DVERSION=0.0.0 -DMINIMAL_ONLY packaging/pawse.nsi

  # A script that compiles can still install nothing, register the wrong thing, or leave
  # a folder behind. This builds a real installer and runs the whole round trip on a
  # throwaway machine, three times over: a silent per-user install that starts the app, a
  # silent upgrade over it while the app is running, and a silent per-machine install -
  # each followed by a silent uninstall. It covers the parts no unit test can: the
  # Add/Remove Programs contract in both hives, the INSTDIR redirect on upgrade, the
  # uninstaller working out on its own that it belongs to a machine-wide install, and the
  # quit channel whose event name is hard-coded in BOTH pawse.nsi and the app
  # (packaging/README.md warns they must be changed together). The channel is asserted by
  # TIMING - see Wait-PawseGone in the helper script.
  installer-smoke:
    runs-on: windows-latest
    env:
      UNINST_KEY_USER: HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Pawse
      # The installer is a 32-bit NSIS exe, so its per-machine entry lands in the WOW6432Node
      # view - which is also where UpdateCheck.ReadValue looks for it.
      UNINST_KEY_MACHINE: HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Pawse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK is chosen by global.json, not here: setup-dotnet installs ALONGSIDE
          # what the runner image ships and `dotnet` then picks the newest one, so a bare
          # dotnet-version pins nothing and a new image could swap the SDK under the build.
          global-json-file: global.json

      # The exact publishes release.yml runs (minus the version), so a publish-only break is
      # caught here instead of shipping as a broken release after merge - and the exe this job
      # installs and boots is the shipped layout, compression included.
      - name: Publish both builds
        shell: pwsh
        run: |
          dotnet publish src/Pawse/Pawse.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish-full
          if ($LASTEXITCODE -ne 0) { throw "the self-contained publish failed" }
          dotnet publish src/Pawse/Pawse.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o publish-min
          if ($LASTEXITCODE -ne 0) { throw "the framework-dependent publish failed" }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build the standard and minimal installers
        shell: pwsh
        run: |
          Copy-Item publish-full/Pawse.exe packaging/Pawse.exe     -Force
          Copy-Item publish-min/Pawse.exe  packaging/Pawse-min.exe -Force
          # A silent run of the STANDARD installer deploys the FULL build ($BuildChoice defaults
          # to "full" in .onInit), so the minimal exe only rides along for the File directive
          # there. The MINIMAL_ONLY build below is what actually unpacks and boots it - see the
          # per-machine minimal smoke step, which passes /NORUNTIME rather than have winget pull
          # the ~57 MB runtime onto the runner.
          # From inside packaging/, so OutFile lands next to the script.
          Push-Location packaging
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /WX /V2 /DVERSION=0.0.0 pawse.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /WX /V2 /DVERSION=0.0.0 /DMINIMAL_ONLY pawse.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis /DMINIMAL_ONLY failed with $LASTEXITCODE" }
          Pop-Location
          if (-not (Test-Path packaging/Pawse-Setup-0.0.0.exe)) { throw "makensis wrote no installer" }
          if (-not (Test-Path packaging/Pawse-Setup-0.0.0-min.exe)) { throw "makensis wrote no minimal installer" }
          Add-Content -Path $env:GITHUB_ENV -Value "SETUP=$((Resolve-Path packaging/Pawse-Setup-0.0.0.exe).Path)"
          Add-Content -Path $env:GITHUB_ENV -Value "SETUP_MIN=$((Resolve-Path packaging/Pawse-Setup-0.0.0-min.exe).Path)"

      - name: Per-user - install silently and start the app
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          # Logging is off by default, and the checks prove the app booted by watching
          # pawse.log - so seed a config that turns it on. Dropped into the default per-user
          # install folder BEFORE the install, because /RESTART launches the app the moment the
          # install finishes, leaving no gap to write it in afterwards. The installer only
          # copies settings forward when the target has none, so this survives.
          $seed = Join-Path $env:LOCALAPPDATA 'Programs\Pawse'
          New-Item -ItemType Directory -Force -Path $seed | Out-Null
          '{"General":{"Logging":true}}' | Set-Content (Join-Path $seed 'pawse.json') -Encoding utf8
          # /RESTART too: an automatic update passes it so the tray paw comes back instead of
          # vanishing, and it is only reachable through a silent run - MUI_FINISHPAGE_RUN
          # covers the interactive case and never fires here.
          Start-Process -FilePath $env:SETUP -ArgumentList '/S','/CurrentUser','/RESTART' -Wait
          if (-not (Test-Path $env:UNINST_KEY_USER)) { throw "nothing registered at $env:UNINST_KEY_USER" }
          $entry = Get-ItemProperty $env:UNINST_KEY_USER
          "installed to $($entry.InstallLocation)"
          if ($entry.DisplayVersion -ne '0.0.0') { throw "DisplayVersion is '$($entry.DisplayVersion)', expected 0.0.0" }
          # Recorded so an update offers the build that is actually installed, instead of
          # inferring it from the exe's size - which misreads a full install whenever the
          # size cannot be read. UpdateCheck.DetectInstall prefers this.
          if ($entry.BuildVariant -ne 'full') { throw "BuildVariant is '$($entry.BuildVariant)', expected full" }
          if (-not $entry.QuietUninstallString) { throw "no QuietUninstallString - Windows could not remove this silently" }
          foreach ($f in 'Pawse.exe', 'uninstall.exe', 'pawse.ico', 'LICENSE.txt') {
            if (-not (Test-Path (Join-Path $entry.InstallLocation $f))) { throw "$f missing from the install folder" }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALL_DIR=$($entry.InstallLocation)"
          # Nothing is started here on purpose: /RESTART already did it, through explorer.exe,
          # so it is not this step's child.
          Wait-PawseStarted (Join-Path $entry.InstallLocation 'pawse.log') 1

      - name: Per-user - upgrade in place while the app is running
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          # No /CurrentUser this time: .onInit has to find the existing per-user install on its
          # own, stay in that mode and redirect INSTDIR to it. The running app is asked to quit
          # over the quit channel (timed), the settings already there are left alone, and
          # /RESTART brings the app back for a second "startup complete".
          $before = (Get-ItemProperty $env:UNINST_KEY_USER).InstallLocation
          Start-Process -FilePath $env:SETUP -ArgumentList '/S','/RESTART'
          Wait-PawseGone 8
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and (Get-Process -Name 'Pawse-Setup-0.0.0' -ErrorAction SilentlyContinue)) { Start-Sleep -Milliseconds 500 }
          $entry = Get-ItemProperty $env:UNINST_KEY_USER
          if ($entry.InstallLocation -ne $before) { throw "the upgrade relocated the install from $before to $($entry.InstallLocation)" }
          if (Test-Path $env:UNINST_KEY_MACHINE) { throw "upgrading a per-user install registered a per-machine entry too" }
          $config = Get-Content (Join-Path $env:INSTALL_DIR 'pawse.json') -Raw
          if ($config -notmatch '"Logging":\s*true') { throw "the upgrade replaced pawse.json: $config" }
          Wait-PawseStarted (Join-Path $env:INSTALL_DIR 'pawse.log') 2

      - name: Per-user - uninstall silently and leave nothing behind
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $created = Set-PawseTraces
          $uninstaller = (Get-ItemProperty $env:UNINST_KEY_USER).UninstallString.Trim('"')
          Start-Process -FilePath $uninstaller -ArgumentList '/S'
          # Pawse was running when the uninstall started: the uninstaller asks it to quit over
          # the named event and only force-kills as a fallback - the ceiling proves the channel.
          Wait-PawseGone 8
          Wait-Removed $env:UNINST_KEY_USER $env:INSTALL_DIR
          # Uninstalling leaves nothing: settings, the unpack cache, downloads, registry.
          Assert-NoPawseTraces $created

      - name: Per-machine - install silently and start the app
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          # The runner's shell holds an administrator token, so /AllUsers needs no UAC here.
          # The app is relaunched through explorer.exe and may come up elevated or not; either
          # way it must boot. Seed the log switch where either token finds it - an elevated app
          # writes next to the exe, an un-elevated one falls back to %APPDATA%\Pawse (and
          # carries the seeded file there).
          $installDir = Join-Path $env:ProgramFiles 'Pawse'
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          '{"General":{"Logging":true}}' | Set-Content (Join-Path $installDir 'pawse.json') -Encoding utf8
          Start-Process -FilePath $env:SETUP -ArgumentList '/S','/AllUsers','/RESTART' -Wait
          if (-not (Test-Path $env:UNINST_KEY_MACHINE)) { throw "nothing registered at $env:UNINST_KEY_MACHINE" }
          if (Test-Path $env:UNINST_KEY_USER) { throw "a per-machine install registered a per-user entry too" }
          $entry = Get-ItemProperty $env:UNINST_KEY_MACHINE
          "installed to $($entry.InstallLocation)"
          if ($entry.InstallLocation -ne $installDir) { throw "installed to $($entry.InstallLocation), expected $installDir" }
          if ($entry.BuildVariant -ne 'full') { throw "BuildVariant is '$($entry.BuildVariant)', expected full" }
          if (-not (Test-Path (Join-Path $installDir 'Pawse.exe'))) { throw "Pawse.exe missing from $installDir" }
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Pawse.lnk'
          if (-not (Test-Path $shortcut)) { throw "no common Start Menu shortcut at $shortcut" }
          Add-Content -Path $env:GITHUB_ENV -Value "MACHINE_DIR=$installDir"
          Add-Content -Path $env:GITHUB_ENV -Value "MACHINE_SHORTCUT=$shortcut"
          $log = Join-Path $installDir 'pawse.log'
          $fallback = Join-Path $env:APPDATA 'Pawse\pawse.log'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $log) -and -not (Test-Path $fallback)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $log) { Wait-PawseStarted $log 1 } else { Wait-PawseStarted $fallback 1 }

      - name: Per-machine - uninstall silently and leave nothing behind
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          # The uninstall string carries no /AllUsers: un.onInit has to work out on its own
          # that this is a machine-wide install, or the common shortcut and the HKLM entry stay
          # behind while it reports success.
          $created = Set-PawseTraces
          $uninstaller = (Get-ItemProperty $env:UNINST_KEY_MACHINE).UninstallString.Trim('"')
          Start-Process -FilePath $uninstaller -ArgumentList '/S'
          Wait-PawseGone 8
          Wait-Removed $env:UNINST_KEY_MACHINE $env:MACHINE_DIR
          if (Test-Path $env:MACHINE_SHORTCUT) { throw "the uninstall left the common Start Menu shortcut $env:MACHINE_SHORTCUT behind" }
          if (Get-Process Pawse -ErrorAction SilentlyContinue) { throw "Pawse is still running after the uninstall" }
          # A machine-wide uninstall cleans every account (Pawse.exe --uninstall-cleanup
          # --all-users); this runner has the one, so that is the one checked.
          Assert-NoPawseTraces $created

      - name: Per-machine MINIMAL - install silently and start the app
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          # Minimal + /AllUsers had no coverage at all: every step above deploys the full,
          # self-contained build, so the framework-dependent apphost was never once unpacked and
          # booted by CI - and that is exactly the shape a bug report arrived on. The one thing
          # this proves that nothing else does is that hostfxr finds a runtime it did not bring
          # with it and the CLR comes up.
          #
          # /NORUNTIME so no winget download lands on the runner: setup-dotnet installed the SDK
          # global.json pins, which carries Microsoft.WindowsDesktop.App with it. That makes the
          # step assert the other half of the MINIMAL_ONLY .onInit guard too - it must refuse a
          # silent /NORUNTIME install only when the runtime is MISSING, and this one is present.
          $installDir = Join-Path $env:ProgramFiles 'Pawse'
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          '{"General":{"Logging":true}}' | Set-Content (Join-Path $installDir 'pawse.json') -Encoding utf8
          $proc = Start-Process -FilePath $env:SETUP_MIN -ArgumentList '/S','/AllUsers','/RESTART','/NORUNTIME' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "the minimal installer exited with $($proc.ExitCode) (3 = it did not find the .NET runtime)" }
          if (-not (Test-Path $env:UNINST_KEY_MACHINE)) { throw "nothing registered at $env:UNINST_KEY_MACHINE" }
          $entry = Get-ItemProperty $env:UNINST_KEY_MACHINE
          if ($entry.BuildVariant -ne 'min') { throw "BuildVariant is '$($entry.BuildVariant)', expected min" }
          if (-not (Test-Path (Join-Path $installDir 'Pawse.exe'))) { throw "Pawse.exe missing from $installDir" }
          Add-Content -Path $env:GITHUB_ENV -Value "MIN_DIR=$installDir"
          $log = Join-Path $installDir 'pawse.log'
          $fallback = Join-Path $env:APPDATA 'Pawse\pawse.log'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $log) -and -not (Test-Path $fallback)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $log) { Wait-PawseStarted $log 1 } else { Wait-PawseStarted $fallback 1 }

      - name: Per-machine MINIMAL - uninstall silently and leave nothing behind
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $created = Set-PawseTraces
          $uninstaller = (Get-ItemProperty $env:UNINST_KEY_MACHINE).UninstallString.Trim('"')
          Start-Process -FilePath $uninstaller -ArgumentList '/S'
          Wait-PawseGone 8
          Wait-Removed $env:UNINST_KEY_MACHINE $env:MIN_DIR
          if (Get-Process Pawse -ErrorAction SilentlyContinue) { throw "Pawse is still running after the uninstall" }
          Assert-NoPawseTraces $created

      # A portable copy writes nothing outside its folder: settings and log next to the exe, no
      # registry at all - even locked, with Block Win+L and the media-key block switched on in
      # its pawse.json, since both are installed-only. And an autostart entry an older version
      # let it create is taken back.
      - name: Portable - nothing outside its folder, nothing in the registry
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          $dir = Join-Path $env:RUNNER_TEMP 'pawse-portable'
          New-Item -ItemType Directory $dir -Force | Out-Null
          Copy-Item publish-full/Pawse.exe $dir
          $exe = Join-Path $dir 'Pawse.exe'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-ItemProperty $run -Name Pawse -Value "`"$exe`"" -PropertyType String -Force | Out-Null
          '{"General":{"Logging":true,"StartLocked":true},"SystemBlock":{"WinLock":true,"LaunchMediaKeys":true}}' |
            Set-Content (Join-Path $dir 'pawse.json')
          $systemBefore = Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System'
          Start-Process $exe
          Wait-PawseStarted (Join-Path $dir 'pawse.log') 1
          # The lock engages a dispatcher turn after startup - give a wrong write time to land.
          Start-Sleep -Seconds 3
          if (Get-ItemProperty $run -Name Pawse -ErrorAction SilentlyContinue) { throw "the portable copy kept its autostart entry" }
          if (Test-Path 'HKCU:\Software\Pawse') { throw "the portable copy wrote HKCU\Software\Pawse" }
          if ($null -ne (Get-WinLockPolicy)) { throw "the portable copy wrote DisableLockWorkstation" }
          if (-not $systemBefore -and (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System')) { throw "the portable copy created the Policies\System key" }
          if (Test-Path "$env:APPDATA\Pawse") { throw "the portable copy wrote %APPDATA%\Pawse" }
          if (-not (Select-String -Path (Join-Path $dir 'pawse.log') -Pattern 'removed the entry of this portable copy' -Quiet)) { throw "the log does not show the autostart entry being taken back" }
          Stop-Process -Name Pawse -Force
          "portable copy: config and log in $dir, nothing in the registry"

  # The Microsoft Store build (packaging/msix), built the way release.yml builds it - which
  # compiles the Store flavor with warnings as errors (the updater's files are not compiled
  # there at all, so anything still calling into them fails here) and has makeappx validate
  # the manifest. Then the parts only a packaged run can show, on a throwaway machine:
  #   - it really runs as its package, with its config in the package's LocalState;
  #   - Block Win+L's policy value is visible OUTSIDE the package, i.e. the registry
  #     virtualization exemption in AppxManifest.xml works - without it the write lands in a
  #     private hive and Win+L is never blocked;
  #   - a copy killed while locked leaves the value behind, and the next start sweeps it
  #     from the marker in Software\Pawse (the same exemption), which is all an MSIX has in
  #     place of an uninstaller's sweep.
  store:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK is chosen by global.json, not here: setup-dotnet installs ALONGSIDE
          # what the runner image ships and `dotnet` then picks the newest one, so a bare
          # dotnet-version pins nothing and a new image could swap the SDK under the build.
          global-json-file: global.json

      - name: Build the MSIX
        shell: pwsh
        run: ./packaging/msix/build-msix.ps1

      # An unsigned layout registers only with Developer Mode on - which is exactly how the
      # build script's -Register installs it on a dev box.
      - name: Install the package layout
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f
          if ($LASTEXITCODE -ne 0) { throw "could not enable Developer Mode" }
          Import-Module Appx -UseWindowsPowerShell -WarningAction SilentlyContinue
          Add-AppxPackage -Register packaging/msix/out/stage/AppxManifest.xml
          $pkg = Get-AppxPackage -Name Pawse.Dev
          if (-not $pkg) { throw "Pawse.Dev did not register" }
          "registered $($pkg.PackageFullName)"
          "PKG_FULL=$($pkg.PackageFullName)" >> $env:GITHUB_ENV
          "LOCAL_STATE=$env:LOCALAPPDATA\Packages\$($pkg.PackageFamilyName)\LocalState" >> $env:GITHUB_ENV
          "PAWSE_ALIAS=$env:LOCALAPPDATA\Microsoft\WindowsApps\pawse.exe" >> $env:GITHUB_ENV

      - name: Packaged start - identity, data folder, Win+L outside the package
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          "POLICY_KEY_BEFORE=$(Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System')" >> $env:GITHUB_ENV
          New-Item -ItemType Directory $env:LOCAL_STATE -Force | Out-Null
          # Lock at start with Block Win+L on, so the policy value gets written.
          '{"General":{"Logging":true,"StartLocked":true},"SystemBlock":{"WinLock":true}}' |
            Set-Content (Join-Path $env:LOCAL_STATE 'pawse.json')
          # Through the app execution alias, the way Restart as administrator relaunches it.
          Start-Process $env:PAWSE_ALIAS
          $log = Join-Path $env:LOCAL_STATE 'pawse.log'
          Wait-PawseStarted $log 1
          $line = "$(Select-String -Path $log -Pattern 'store build: package' | Select-Object -Last 1)"
          $line
          $has = { param($text) $line.IndexOf($text, [StringComparison]::OrdinalIgnoreCase) -ge 0 }
          if (-not (& $has $env:PKG_FULL)) { throw "Pawse did not run as its package" }
          if (-not (& $has $env:LOCAL_STATE)) { throw "Pawse's data folder is not the package's LocalState" }
          Wait-WinLockPolicy 1 20

      - name: Killed while locked - the next start sweeps the value
        shell: pwsh
        run: |
          . .github/scripts/installer-smoke-helpers.ps1
          # A hard kill skips OnExit, like a crash or an uninstall that just ends the process.
          Stop-Process -Name Pawse -Force
          Wait-PawseGone 10
          if ((Get-WinLockPolicy) -ne 1) { throw "the value should outlive a hard kill - is the test still testing anything?" }
          '{"General":{"Logging":true},"SystemBlock":{"WinLock":true}}' |
            Set-Content (Join-Path $env:LOCAL_STATE 'pawse.json')
          Start-Process $env:PAWSE_ALIAS
          Wait-PawseStarted (Join-Path $env:LOCAL_STATE 'pawse.log') 2
          Wait-WinLockPolicy $null 20
          # ...and nothing else of Pawse's stays in the (un-virtualized) registry either.
          if (Test-Path 'HKCU:\Software\Pawse') { throw "HKCU\Software\Pawse outlived the sweep" }
          if ($env:POLICY_KEY_BEFORE -eq 'False' -and (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\System')) { throw "the Policies\System key Pawse created outlived the sweep" }
          Stop-Process -Name Pawse -Force
          Import-Module Appx -UseWindowsPowerShell -WarningAction SilentlyContinue
          Remove-AppxPackage -Package $env:PKG_FULL
