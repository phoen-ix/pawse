name: release

# Auto-versioned releases. Every push to main is inspected for Conventional
# Commit messages and, when a release-worthy change is present, a new semver tag
# is created and a built GitHub Release is published:
#
#   fix: ...                      -> patch   (v0.1.0 -> v0.1.1)
#   feat: ...                     -> minor   (v0.1.0 -> v0.2.0)
#   feat!: ...  /  BREAKING CHANGE-> major   (v0.1.0 -> v1.0.0)
#   ci: / chore: / docs: / ...    -> no release
#
# The version is computed on Linux by a small inline script (git + Conventional
# Commit parsing) and the app is built and published on Windows in a dependent
# job. One third-party action (action-gh-release, pinned to a commit SHA)
# creates the tag and release at the built commit; no PAT or cross-workflow
# tag trigger is needed.
#
# It can also be run by hand (Actions → release → Run workflow), which states the bump
# instead of inferring it - for when the commits since the last tag are all ci:/docs:
# but a release is still wanted, e.g. to publish an asset only the pipeline can build.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this manual release'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# Write access is scoped to the one job that publishes the release; everything
# else (including any future job added here) inherits read-only.
permissions:
  contents: read

# Queue, never cancel: two rapid pushes to main must not compute the same next
# tag in parallel and race on tag/release creation.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version from Conventional Commits
        id: bump
        shell: bash
        # Empty on a push; one of patch/minor/major when started by hand. Read through
        # env, never interpolated into the script.
        env:
          FORCED_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          # Highest strictly-numeric vX.Y.Z tag (semver-sorted), and commits
          # since it. Non-conforming tags are ignored: refnames may contain
          # $ ( ), and the parsed version is later interpolated into pwsh.
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -n "$latest" ]; then
            range="${latest}..HEAD"
            cur="${latest#v}"
          else
            range="HEAD"
            cur="0.0.0"
          fi

          bump=none
          if [ -n "${FORCED_BUMP:-}" ]; then
            # Started by hand: the operator picked the bump, so no inference at all.
            case "$FORCED_BUMP" in
              patch|minor|major) bump="$FORCED_BUMP" ;;
              *) echo "::error::Unsupported bump '$FORCED_BUMP'"; exit 1 ;;
            esac
            echo "Manual run: forcing a $bump release."
          else
            # Type prefixes are matched against SUBJECTS only - a body line quoting
            # "fix: ..." (a revert, a changelog paste) must not cut a release. The
            # BREAKING CHANGE footer lives in the body by definition, so that one
            # grep scans full messages.
            subjects=$(git log --format='%s' "$range")
            bodies=$(git log --format='%B' "$range")

            # Highest-precedence bump wins: breaking > feat > fix; anything else = none.
            if grep -qE '^[a-z]+(\([^)]+\))?!:' <<<"$subjects" || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
              bump=major
            elif grep -qE '^feat(\([^)]+\))?:' <<<"$subjects"; then
              bump=minor
            elif grep -qE '^fix(\([^)]+\))?:' <<<"$subjects"; then
              bump=patch
            fi
          fi

          echo "Latest tag: ${latest:-<none>}   bump: $bump"

          if [ "$bump" = none ]; then
            echo "No release-worthy commits since ${latest:-start}; skipping release."
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "new_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r MA MI PA <<<"$cur"
          # Belt-and-braces: outputs feed pwsh interpolation, so refuse anything
          # that is not three plain numbers.
          if ! [[ "$MA" =~ ^[0-9]+$ && "$MI" =~ ^[0-9]+$ && "$PA" =~ ^[0-9]+$ ]]; then
            echo "::error::Version '$cur' parsed from tag '${latest:-<none>}' is not purely numeric; refusing to release."
            exit 1
          fi
          case "$bump" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          newver="${MA}.${MI}.${PA}"
          echo "Next version: v${newver}"
          echo "new_tag=v${newver}" >> "$GITHUB_OUTPUT"
          echo "new_version=${newver}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.new_tag != ''
    runs-on: windows-latest
    # contents: write only here - this job creates the tag and the release, and commits
    # the update feed.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the update-feed commit at the end rebases onto main.
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      # No-install build: the whole .NET runtime is bundled and compressed
      # (~63 MB). Just download and run - nothing to install.
      - name: Publish standalone (no install, compressed)
        shell: pwsh
        run: >
          dotnet publish src/Pawse/Pawse.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ needs.version.outputs.new_version }}
          -o publish-full

      # Minimal build: a tiny launcher (~0.2 MB) that uses an already-installed
      # .NET 8 Desktop Runtime.
      - name: Publish minimal (needs .NET Desktop Runtime)
        shell: pwsh
        run: >
          dotnet publish src/Pawse/Pawse.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:Version=${{ needs.version.outputs.new_version }}
          -o publish-min

      # The installers used to be the one hand-built asset (packaging/README.md): both
      # builds have to exist side by side for the File directives, which is exactly what
      # the two publishes above just produced. NSIS is not on the Windows image.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      # Same two makensis invocations as packaging/build.bat, at the release version.
      # -WX: a warning here means the script isn't doing what it reads like it does.
      - name: Build all three installers
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          Copy-Item publish-full/Pawse.exe packaging/Pawse.exe     -Force
          Copy-Item publish-min/Pawse.exe  packaging/Pawse-min.exe -Force
          $version = "${{ needs.version.outputs.new_version }}"
          # From inside packaging/, so OutFile lands next to the script. No define = the
          # standard installer that asks which build to deploy; the other two carry one
          # build each. Same three invocations as packaging/build.bat.
          Push-Location packaging
          foreach ($define in '', '/DFULL_ONLY', '/DMINIMAL_ONLY') {
            $nsisArgs = @('/WX', '/V2', "/DVERSION=$version")
            if ($define) { $nsisArgs += $define }
            $nsisArgs += 'pawse.nsi'
            & $makensis @nsisArgs
            if ($LASTEXITCODE -ne 0) { throw "makensis $define failed with $LASTEXITCODE" }
          }
          Pop-Location
          Move-Item packaging/Pawse-Setup-*.exe . -Force
          foreach ($suffix in '', '-full', '-min') {
            $file = "Pawse-Setup-${{ needs.version.outputs.new_version }}$suffix.exe"
            if (-not (Test-Path $file)) { throw "$file was not built" }
          }
          Get-ChildItem Pawse-Setup-*.exe | ForEach-Object { "built {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB) }

      # Zip each exe. Compress-Archive stores the file's leaf name inside the
      # archive, so users extract a plainly-named Pawse.exe / Pawse-min.exe.
      - name: Stage & zip assets
        shell: pwsh
        run: |
          Copy-Item publish-full/Pawse.exe Pawse.exe
          Copy-Item publish-min/Pawse.exe  Pawse-min.exe
          Compress-Archive -Path Pawse.exe     -DestinationPath "Pawse-${{ needs.version.outputs.new_version }}.zip"     -Force
          Compress-Archive -Path Pawse-min.exe -DestinationPath "Pawse-${{ needs.version.outputs.new_version }}-min.zip" -Force
          Get-FileHash "Pawse-${{ needs.version.outputs.new_version }}.zip", "Pawse-${{ needs.version.outputs.new_version }}-min.zip", "Pawse-Setup-${{ needs.version.outputs.new_version }}.exe", "Pawse-Setup-${{ needs.version.outputs.new_version }}-full.exe", "Pawse-Setup-${{ needs.version.outputs.new_version }}-min.exe" -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          # Pin the new tag to the commit this job checked out and built. Left out, the
          # API tags the default branch's HEAD at publish time - so a push landing during
          # the build would get the tag (pointing at code these binaries don't contain),
          # and the queued run for that push would then see no commits past the tag and
          # silently release nothing.
          target_commitish: ${{ github.sha }}
          files: |
            Pawse-Setup-${{ needs.version.outputs.new_version }}.exe
            Pawse-Setup-${{ needs.version.outputs.new_version }}-full.exe
            Pawse-Setup-${{ needs.version.outputs.new_version }}-min.exe
            Pawse-${{ needs.version.outputs.new_version }}.zip
            Pawse-${{ needs.version.outputs.new_version }}-min.zip
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            **Pawse ${{ needs.version.outputs.new_tag }}** - Windows keyboard lock.

            **Install it** - run the setup and follow it; per-user by default, so no admin.
            Not sure? Take the all-in-one.

            | Installer | Download size | Needs anything installed? |
            | --- | --- | --- |
            | **`Pawse-Setup-${{ needs.version.outputs.new_version }}-full.exe`** | ~58 MB | **No** - all-in-one, the runtime is inside. Installs straight away. |
            | **`Pawse-Setup-${{ needs.version.outputs.new_version }}-min.exe`** | ~0.5 MB | Yes - the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) (x64), fetched for you if missing. |
            | **`Pawse-Setup-${{ needs.version.outputs.new_version }}.exe`** | ~58 MB | It asks you which of the two builds above to install. |

            **Or stay portable** - unzip and run the exe inside, nothing is written outside its folder:

            | Portable | Download size | Needs anything installed? |
            | --- | --- | --- |
            | **`Pawse-${{ needs.version.outputs.new_version }}.zip`** | ~58 MB (63 MB unzipped) | **No** - the runtime is bundled. Just unzip and run. |
            | **`Pawse-${{ needs.version.outputs.new_version }}-min.zip`** | ~0.2 MB | Yes - the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) (x64). |

            Every download is the same app; the full build bundles the runtime, the
            `-min` build reuses one you install once. Windows may mark a downloaded file
            as blocked - if an exe won't start, right-click it (or the zip) →
            **Properties → Unblock** first. The tray paw is your control; the
            config and log are written next to the exe. `SHA256SUMS.txt` holds
            checksums for every download.

            Already have Pawse installed? **Settings → About → Check now**
            offers this build and installs it for you.

      # The update feed the app reads when the user picks "Check for updates…" - published
      # on pawse.at, which serves web/site straight from this repo. It has to be written
      # AFTER the release exists, or it would point at assets that 404. The commit carries
      # the skip-ci marker below so publishing a feed doesn't re-run the whole pipeline.
      #
      # Careful when writing ABOUT that marker: GitHub honours it anywhere in the message of
      # a pushed commit, subject or body, so a commit that merely mentions it verbatim
      # silently skips its own CI and release runs. Say "skip-ci marker" in prose instead.
      - name: Publish the update feed
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.new_version }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/v$version"
          function Sha([string]$file) { (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() }
          $feed = [ordered]@{
            version    = $version
            notes      = "https://github.com/${{ github.repository }}/releases/tag/v$version"
            # Absent means allowed, so every feed written before this key existed stays valid.
            # Setting it to false in a follow-up commit is the ONLY way to stop a bad release
            # installing itself on every copy set to "download and install automatically" -
            # installed copies have no rollback, and the alternative is cutting another
            # release and waiting out another 24 h of daily checks.
            auto       = $true
            installers = [ordered]@{
              full = [ordered]@{ url = "$base/Pawse-Setup-$version-full.exe"; sha256 = Sha "Pawse-Setup-$version-full.exe" }
              min  = [ordered]@{ url = "$base/Pawse-Setup-$version-min.exe";  sha256 = Sha "Pawse-Setup-$version-min.exe" }
            }
            # Portable copies replace their own exe, and need a checksum from THIS host to
            # cross-check a zip served by GitHub - the same reason the installers are listed
            # here rather than trusting GitHub's own SHA256SUMS.txt.
            portable   = [ordered]@{
              full = [ordered]@{ url = "$base/Pawse-$version.zip";     sha256 = Sha "Pawse-$version.zip" }
              min  = [ordered]@{ url = "$base/Pawse-$version-min.zip"; sha256 = Sha "Pawse-$version-min.zip" }
            }
          }
          # LF and a trailing newline: ConvertTo-Json emits CRLF on Windows, which would
          # rewrite the whole file on every release and look like a change that isn't one.
          $json = (($feed | ConvertTo-Json -Depth 5) -replace "`r`n", "`n") + "`n"
          Set-Content web/site/latest.json -Value $json -NoNewline -Encoding utf8
          Get-Content web/site/latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/site/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "feed unchanged - nothing to commit"; exit 0 }
          git commit -m "chore(release): update feed for v$version [skip ci]"
          # A pwsh step only fails on the LAST command's exit code, and a conflicted
          # rebase leaves HEAD at the upstream tip - the push then "succeeds" as a no-op
          # and the feed commit is silently gone. Fail the step at the first git error
          # instead, so a human sees that latest.json still needs publishing.
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw "git pull --rebase failed - the feed commit was NOT pushed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "git push failed - the feed commit was NOT pushed" }
