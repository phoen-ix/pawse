ShortDescription: A cat-proof keyboard lock for Windows.
Description: |-
  Pawse freezes the keyboard with one click or a hotkey, so a cat walking across it can't close your work, fire off shortcuts or leave a modifier key stuck. Unlock it deliberately: with a keyboard chord, a typed passphrase, a hold-to-unlock button or an automatic timer.
  It lives in the system tray, can block the mouse as well, and makes no network connections unless you check for updates.
